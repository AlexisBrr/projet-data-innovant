<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord - Commune de Grenoble</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Intégration de l'API d'intégration de Tableau -->
    <script type="text/javascript" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Etude de l'accidentologie à vélo et des voies cyclables de la commune de Grenoble - Le but du projet</h1>
            <nav>
                <ul>
                    <li><a href="#">Pour les usagers</a></li>
                    <li><a href="#">Pour les politiques locales</a></li>
                    <li><a href="#">Pour les acteurs de la base de données des accidents de vélo</a></li>
                    <li><a href="#">A propos de nous</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <h2>Tableau de bord interactif</h2>
            <!-- Conteneur pour le tableau de bord Tableau -->
            <div id="tableauViz"></div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; Les Datavengers - 2025</p>
        </div>
    </footer>

    <script type="text/javascript">
        // URL du tableau de bord publié sur Tableau Public ou votre serveur Tableau
        var tableauUrl = "URL_DU_TABLEAU_DE_BORD";

        var options = {
            hideTabs: true,
            hideToolbar: true,
            width: "100%",
            height: "600px"
        };

        var vizContainer = document.getElementById("tableauViz");
        var viz = new tableau.Viz(vizContainer, tableauUrl, options);
    </script>
</body>
</html>
